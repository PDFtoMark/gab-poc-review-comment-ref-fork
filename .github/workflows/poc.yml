name: poc-review-comment-ref
on:
  pull_request_review_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: fork workflow probe
        env:
          CANARY: ${{ secrets.POC_SECRET }}
          TOK: ${{ github.token }}
        run: |
          echo "FORK_WORKFLOW_RAN"
          if [ -n "$CANARY" ]; then echo "SECRET_PRESENT len=${#CANARY}"; else echo "SECRET_ABSENT"; fi
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then echo "OIDC_AVAILABLE"; else echo "OIDC_ABSENT"; fi
          curl -s -H "Authorization: Bearer $TOK" https://api.github.com/repos/PDFtoMark/gab-poc-review-comment-ref | jq -c '{perms: .permissions, full: .full_name}'
          echo "actor=${{ github.actor }} assoc=${{ github.event.comment.author_association }}"
